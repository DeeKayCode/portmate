name: CI
on:
  push:
    branches: [main, client, server]
  pull_request:
    branches: [main, client, server]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify automation and source-of-truth baseline
        shell: pwsh
        run: ./automation/scripts/test-bootstrap.ps1
      - name: Offline worker integration tests
        shell: pwsh
        run: ./automation/scripts/test-worker-integration.ps1
      - name: Dependency synchronization regression tests
        shell: pwsh
        run: ./automation/scripts/test-dependency-sync.ps1
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portmate
          POSTGRES_PASSWORD: portmate-ci-only
          POSTGRES_DB: portmate_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U portmate -d portmate_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://portmate:portmate-ci-only@localhost:5432/portmate_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with: {node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json}
      - run: npm --prefix server ci
      - run: npm --prefix mobile ci
      - run: npm --prefix server audit --omit=dev --audit-level=high
      - run: npm --prefix server run validate:contracts
      - run: npm --prefix server run typecheck
      - run: npm --prefix server run lint
      - run: npm --prefix server test
      - run: npm --prefix server run build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Detect mobile PWA
        id: mobile
        run: test -f mobile/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        if: steps.mobile.outputs.present == 'true'
        with: {node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json}
      - if: steps.mobile.outputs.present == 'true'
        run: npm --prefix mobile ci && npm --prefix mobile audit --omit=dev --audit-level=high && npm --prefix mobile run lint && npm --prefix mobile run typecheck && npm --prefix mobile test && npm --prefix mobile run build
      - if: steps.mobile.outputs.present != 'true'
        run: echo "::notice::Mobile PWA will be validated after Gemini initializes it."
  docker:
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Build and smoke test complete Compose application
        env:
          POSTGRES_PASSWORD: portmate-ci-ephemeral-only
          JWT_SECRET: portmate-ci-ephemeral-only-secret-32-characters
          PORTMATE_PORT: 3000
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail http://localhost:3000/
          curl --fail http://localhost:3000/api/v1/health
      - if: always()
        env:
          POSTGRES_PASSWORD: portmate-ci-ephemeral-only
          JWT_SECRET: portmate-ci-ephemeral-only-secret-32-characters
        run: docker compose down --volumes
  release:
    if: startsWith(github.event.head_commit.message, '[CLIENT_COMPLETE] ')
    needs: [bootstrap, backend, mobile, docker]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Validate complete release gates
        shell: pwsh
        run: ./automation/scripts/test-release-gates.ps1 -RequireComplete
