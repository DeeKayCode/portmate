name: CI
on:
  push:
    branches: [main, client, server]
  pull_request:
    branches: [main, client, server]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify automation
        shell: pwsh
        run: ./automation/scripts/test-bootstrap.ps1
      - name: Offline worker integration tests
        shell: pwsh
        run: ./automation/scripts/test-worker-integration.ps1
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate configured release gates
        shell: pwsh
        run: ./automation/scripts/test-release-gates.ps1
